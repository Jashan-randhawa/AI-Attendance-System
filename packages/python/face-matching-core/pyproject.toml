[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartattend-face-matching"
version = "1.0.0"
description = "Provider-neutral face embedding normalization, cosine similarity, and top-K candidate matching engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jashan Randhawa", email = "jashanrandhawa76@gmail.com" }
]
keywords = ["face-recognition", "embeddings", "cosine-similarity", "biometrics", "vector-search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.20.0"
]

[project.urls]
Homepage = "https://github.com/Jashan-randhawa/AI-Attendance-System"
Repository = "https://github.com/Jashan-randhawa/AI-Attendance-System"
Issues = "https://github.com/Jashan-randhawa/AI-Attendance-System/issues"
